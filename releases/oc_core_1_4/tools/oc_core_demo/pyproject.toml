[project]
name = "oc-core-demo"
version = "1.4.0.post9"
description = "Dual-edition OC System Architect Workbench for OC Core 1.4"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
oc-core-demo = "oc_core_demo.core:main"
oc-core-demo-launch = "oc_core_demo.portable_launcher:main"

[project.optional-dependencies]
ui = ["streamlit>=1.54"]
test = ["pytest>=8", "jsonschema>=4"]
build = ["pyinstaller>=6", "streamlit>=1.54"]

[tool.setuptools]
packages = ["oc_core_demo"]
include-package-data = true

[tool.setuptools.package-data]
oc_core_demo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
