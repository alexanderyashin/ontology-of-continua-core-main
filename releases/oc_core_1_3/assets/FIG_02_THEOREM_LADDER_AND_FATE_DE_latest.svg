<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-labelledby="title desc"> <rect width="1280" height="100%" fill="#f8fafc"/> <rect x="24" y="24" width="1232" height="100%" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/> <title>Abbildung 2. Satzleiter und Stützstatus</title> <desc>Positive Beweisstütze und ausgeschlossene geerbte Zeilen werden gemeinsam gezeigt</desc> <text x="48" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Abbildung 2. Satzleiter und Stützstatus</text> <text x="48" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#475569">Positive Beweisstütze und ausgeschlossene geerbte Zeilen werden gemeinsam gezeigt</text> <text x="48" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Satz A (quellengeprüfte Klassifikation postkollaptischer Identität): positiver Hauptkörper</text> <text x="48" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Quellenkorollar 3.2 (Irreversibilität des Todes): positive Quellenstütze</text> <text x="48" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Quellentheorem 3 (Tod durch Grenz- und Einbettungskollaps): positive Quellenstütze</text> <text x="48" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Ausgeschlossene geerbte oder entfernte Zeilen:</text> <text x="48" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Satz 1 (Darstellbarkeit von K2): aus dem Artikelumfang ausgeschlossen</text> <text x="48" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Monotones Wachstum von Einbettungsräumen: aus dem Artikelumfang ausgeschlossen</text> <text x="48" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Unvereinbarkeit von Schwelle und Ausdruckskraft: aus dem Artikelumfang ausgeschlossen</text> <text x="48" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Unvollständigkeit von Einbettungsräumen: aus dem Artikelumfang ausgeschlossen</text> <text x="48" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Satz 2 (Darstellbarkeit von K4): aus dem Artikelumfang ausgeschlossen</text> <text x="48" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f172a">Satz 3 (Darstellbarkeit von K8): aus dem Artikelumfang ausgeschlossen</text> <text x="48" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#334155">Ungelöste Blocker der Hauptkette: 0.</text> <text x="48" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#334155">Nur-im-Anhang- oder außerhalb-liegende Satzfamilien: 0.</text> <text x="48" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#334155">Ausgeschlossene Satzfamilien: 9.</text> </svg>
