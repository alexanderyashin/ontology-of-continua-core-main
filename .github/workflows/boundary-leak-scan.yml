name: Boundary leak scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run public boundary scan
        run: python run_release_machine_gate.py --release oc_core_1_3_2 --channel all --mode pre_publish
