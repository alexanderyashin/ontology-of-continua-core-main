name: parfitian-cerberus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "release_machine/parfit/**"
      - "scripts/oc_parfit_audit.py"
      - "benchmarks/parfit/**"
      - "schemas/parfit/**"
      - "configs/parfit/**"
      - "docs/core/parfit/**"

jobs:
  parfitian-cerberus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install jsonschema pyyaml pytest
      - run: python scripts/oc_parfit_audit.py --benchmark benchmarks/parfit/parfit_benchmark_corpus.yaml --fail-on high --format json
      - run: python -m pytest tests/parfit -q
