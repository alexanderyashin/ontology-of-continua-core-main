name: Release quality

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run release machine
        run: python -m release_machine evaluate --release oc_core_1_3_2 --channel all --mode pre_publish
      - name: Package no-send bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: python -m release_machine package --release oc_core_1_3_2 --channel all --no-publish
      - name: Upload manual-review bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: oc-core-1.3.2-no-send-bundle
          path: releases/oc_core_1_3_2/artifacts/oc_core_1_3_2_zenodo_release.zip
