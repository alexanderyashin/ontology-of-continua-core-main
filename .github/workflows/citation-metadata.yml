name: Citation metadata

on:
  pull_request:
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate metadata through release machine
        run: python -m release_machine evaluate --release oc_core_1_3_2 --channel github_repo_public_surface --mode pre_publish
